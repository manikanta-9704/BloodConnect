services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloodconnect}
      POSTGRES_USER: ${POSTGRES_USER:-bloodconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloodconnect}
    ports: ["5432:5432"]
    volumes: ["bloodconnect_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodconnect -d bloodconnect"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bloodconnect}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bloodconnect}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bloodconnect}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  bloodconnect_data:
